name: pr-gate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  size-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diff size gate (3500 lines)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/trellis_diff.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --check
